name: tans-plus-db-dev

services:
  postgres:
    image: postgres:18-alpine
    container_name: tans-plus-db-dev-postgres
    environment:
      POSTGRES_DB: tans-plus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - tans-plus-db-dev-postgres-dev:/var/lib/postgresql

volumes:
  tans-plus-db-dev-postgres-dev:
